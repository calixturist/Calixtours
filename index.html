<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calixturist | Descubre El Salvador</title>

<style>

:root {
    --bg: #FAFBFC;
    --panel: #F2F8FB;
    --text: #102A43;
    --muted: #52697A;
    --accent: #59BFE6;
    --accent-light: #DDF3FB;
    --white: #FFFFFF;
    --max: 1200px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, Arial, Helvetica, sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.wrap {
    width: min(var(--max), calc(100% - 34px));
    margin: auto;
}


/* NAVEGACIÓN */

nav {
    position: fixed;
    z-index: 20;
    left: 0;
    right: 0;
    top: 0;
    background: linear-gradient(
        rgba(255,255,255,.96),
        rgba(255,255,255,.78),
        transparent
    );
}

.nav {
    min-height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    font-weight: 900;
    letter-spacing: .08em;
}

.brand b {
    color: var(--accent);
}

.links {
    display: flex;
    gap: 25px;
    font-size: .92rem;
    color: var(--text);
    font-weight: 600;
}


/* PORTADA */

.hero {
    min-height: 100svh;
    display: flex;
    align-items: end;
    position: relative;
    color: white;

    background:
    linear-gradient(
        180deg,
        rgba(4,18,28,.12),
        rgba(4,18,28,.20) 35%,
        rgba(7,27,40,.82) 97%
    ),
    url('https://elsalvador.travel/system/wp-content/uploads/2018/09/Conchagua-2000x1200.jpg')
    center/cover;
}

.hero-content {
    padding: 160px 0 68px;
}

.tag {
    font-size: .75rem;
    letter-spacing: .20em;
    text-transform: uppercase;
    color: #8DDAF3;
    margin-bottom: 18px;
}

h1 {
    font-size: clamp(4rem,10vw,9rem);
    line-height: .86;
    letter-spacing: -.06em;
    margin: 0;
    max-width: 1000px;
}

.lead {
    font-size: clamp(1rem,1.6vw,1.25rem);
    max-width: 670px;
    color: #F5F8FA;
    margin: 28px 0;
}

.button {
    display: inline-block;
    background: var(--accent);
    color: #102A43;
    padding: 15px 22px;
    border-radius: 999px;
    font-weight: 800;
    transition: transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;
}

.button:hover {
    transform: translateY(-2px);
    background: #77CCE9;
    box-shadow: 0 10px 28px rgba(42,150,190,.25);
}


/* SECCIONES */

section {
    padding: 105px 0;
}

.head {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 40px;
    align-items: end;
    margin-bottom: 42px;
}

h2 {
    font-size: clamp(2.6rem,5vw,5.2rem);
    line-height: .96;
    letter-spacing: -.045em;
    margin: 0;
}

.muted {
    color: var(--muted);
    line-height: 1.7;
}

.smalltag {
    color: #249BC7;
    letter-spacing: .15em;
    text-transform: uppercase;
    font-size: .72rem;
    font-weight: 800;
    margin-bottom: 10px;
}


/* DESTINOS */

.grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 18px;
}

.card {
    min-height: 510px;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(16,42,67,.10);
    box-shadow: 0 12px 34px rgba(16,42,67,.08);
    cursor: pointer;

    transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}

.card:after {
    content: "";
    position: absolute;
    inset: 0;

    background:
    linear-gradient(
        transparent 42%,
        rgba(8,25,38,.88)
    );
}

.card-info {
    position: absolute;
    z-index: 2;
    left: 24px;
    right: 24px;
    bottom: 24px;
    color: white;
}

.card h3 {
    font-size: 1.7rem;
    margin: 0 0 7px;
}

.card p {
    margin: 0;
    color: #F3F7F8;
    line-height: 1.5;
}


/* EFECTO ZOOM */

.card img,
.g img,
.photo img {
    transition:
        transform .45s ease,
        filter .45s ease;
